modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - create_motor
    - create_objects
    - color_articulation_links
    - create_kinematic_sensor
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - update_motor_target # the desired motor angle is fixed once per control step (hold: target)
  pre_gym_step_modules:
    - update_motor # motor angle = joint angle, velocity = its finite difference
    - apply_motor_servo
    - apply_motor_forces
  post_gym_step_modules:
    - update_robot # every substep reads the state the last one reached (joint / tendon states need no forward kinematics)
  post_physics_step_modules:
    - update_kinematics # forward kinematics once per control step, before the kinematic sensors are read
    - update_objects
    - update_kinematic_sensor
    - goal_pose
    - reward
    - termination
    - reset_envs
    - observation
    - goal_visualization
    - camera_recorder

create_rigid_vsim_envs:
  num_envs: 1024
  num_envs_per_set: 1
  # The seed comes from ppo.yaml params.seed (or --seed); see sync_seed in modular_runner.py.
  enhanced_determinism: true # vlearn determinism mode (~1 % slower)
  device: cuda:0
  timestep: ${1/200} # physics (and servo law) at 200 Hz, as the robot loop
  frame_skip: 10 # physics steps per control (policy) step: 20 Hz control

# Full hand without tendons (urdf_to_vsim.py full_motor): a motor on every revolute joint (per finger Abd, MCP, PIP, DIP;
# thumb CMC1, CMC2, MCP, IP: 20), each joint's armature the servo inertia J = 0.0012 kg m^2.
create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_full_motor.vsim
  fixed_hand: true
  self_collisions: true
  fixed_hand_root_pos: [-0.15, -0.15, 0.1]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: false
  randomize_pose: false
  link_friction: 1.0
  # Every joint motor gets a policy action (e.g. [abd]: the Abd joints get none and stay free).
  passive_motor_substrings: []

create_objects:
  objects:
    cube:
      asset: cube_mid_mesh # 5 cm cube, convex mesh (the goal height below is for this size)
      init_position: [-0.066, -0.156, 0.25] # above the goal point (goal_pose), dropped ~3 cm onto the hand
      init_orientation: [0, 0, 0, 1] # 45 deg about world x (xyzw), every reset: an edge in the gap
      # init_orientation: 'random'
      init_angular_velocity: [0.0, 0.0, 0.0] # rad/s about env z (up, out of the palm), on every reset
  reward_object: cube

# Render colors (visual only): one generated palette color per digit (link-name group) and one for the cube.
color_articulation_links:
  exclude_substrings: [_abd, _base, slider]

# Video of env 0 in play mode: PNG frames of the camera rig's cameras (camera_side, camera_top) at ~30 fps in
# <run>/videos/<checkpoint>_<time>/, turned by ffmpeg at the end into <run>/<checkpoint>_<time>_<camera>.mp4.
camera_recorder:
  enabled: False # ${eval:'mode == "play"'}
  camera_rig: camera_rig
  frame_stride: 1 # 20 Hz / 1 = 20.0 fps

# Fixed goal over the finger bases in the middle of the hand, at the 5 cm cube's rest height there: x on the MCP line
# (Middle / Ring MCP at x -0.064 / -0.069), y the mean of the four finger MCPs (Index -0.195 .. Pinky -0.120), z where
# the cube settles on the open, held hand (dropped at (-0.066, -0.156): rests at (-0.072, -0.162, 0.161), 2026-11-20).
goal_pose:
  goal_position:
    x: [-0.066, -0.066]
    y: [-0.156, -0.156]
    z: [0.161, 0.161]
  goal_orientation: [0, 0, 0, 1] # unused by the position reward
  types:
    discrete: {} # static, never resampled

process_variable_actions:
  # Change of the motor (joint) angle [rad] per joint servo, as the spool targets of adapt_cube: desired = position +
  # action (>= -1 rad), held per control step; the servo current is 0.1 A/rad * (desired - position). The policy output
  # [-1, 1] maps to [min, max] (unclipped).
  min_dof_scale: -0.75
  max_dof_scale: 1.5

apply_motor_forces: {}

# Joint servos: one per policy-controlled motor (create_robot passive_motor_substrings), in the vsim's motor order
# (printed at start-up); the servo inertia is the joint armature.
create_motor: {}

# Servo law on the joint motors (the robot servo's law, as adapt_cube's spools): joint torque tau_m + tau_f, applied
# by 'apply_motor_forces'. The friction budget tau_f_max comes from the learned envelope (friction_model_path, in
# optimal_morphology_rl_assets/models/actuators), scaled by the curriculum factor; its motor constants must match the
# model's (weak gain: K_t 0.5, i_0 0.05).
apply_motor_servo:
  motor_position_gain: 0.1 # A/rad, current = gain * (target - position), as on the robot
  torque_constant: 0.5 # Nm/A, torque = K_t * sign(i) * max(|i| - i_0, 0)
  current_deadband: 0.05 # A, i_0
  max_velocity: 7.6 # rad/s at the joint (the measured servo speed limit)
  min_target: -1.0 # rad, lowest desired angle
  # M5 constants (used without friction_model_path; scalar or one per motor), as adapt_cube's spools. The joint load
  # torque tau_e is not measured (0), so the K_e terms have no effect.
  K_v: 0.0015
  K_c: 0.0064
  K_m: 0.028
  K_e_wind: 0.334
  K_e_unwind: 0.334
  v_s: 0.2
  alpha: 1.6
  K_cs: 0.0065
  K_ms: 0.037
  K_es: 0.225

observation:
  num_hist: 10 # history frames (the network input size)
  hist_period: 0.05 # s between frames: every control step at 20 Hz, 1.25 s of history
  modules:
    motor_state: {} # the motor (joint) angles and velocities (rad, rad/s)
    motor_action: {} # the policy's commanded change of the motor angle (rad)
    motor_torques:
      signals: ["tau_f", "tau_inertia", "tau_m", "tau_f_max"]
    object_state:
      signals: [pos, rot, lin_vel, ang_vel] # cube orientation (6D) and velocities in the hand's robot frame
    goal_state:
      signals: [pos] # the goal position in the hand's robot frame (fixed)
  privileged_modules:
    object_state:
      signals: [pos, rot, lin_vel, ang_vel] # cube orientation (6D) and velocities in the hand's robot frame

reward:
  # Hold the cube at the goal: exp(-(|cube - goal|_xy / normalize)^2).
  goal_position_reward:
    scale: 0.1
    axes: [x, y] # distance in the horizontal plane: the cube rising over an edge while it rolls is not penalized
    normalize: 0.02
  # exp(-((min(speed about axis, target_speed) - target_speed) / normalize)^2), 1 at or above the target, speed from the finite difference of the cube's orientation.
  # Best setup so far (runs/adapt_cube/2026_10_26_10_42_37 and seeds, 2026-10-26, with spin +z; target_speed below is -z), speed over
  # 0.2 s (a vibration earns nothing), reward only near the rest point (spinning the cube off the palm earns nothing).
  cube_angular_velocity_reward:
    axis: [0.0, 0.0, 1.0]
    target_speed: -0.5 # rad/s: spin -z (the thumb curls and turns the cube)
    normalize: 0.25 # rad/s
    scale: 1.0
    capped: True # faster than target_speed is not penalized (False: overshoot is, e.g. to track the speed)
    rate_window: 0.2 # s
    # position_gate: 0.04 # m

termination:
  progress:
    max_episode_sec: 8.0
  cube_away_termination:
    box:
      x: [-1, 1] # palm side (MCP at -0.064) .. fingertips
      y: [-1, 1] # thumb / index side .. pinky side
      z: [0, 1] # fell off .. thrown up
    reward_scale: -40.0

render:
  capped_step: true
  paused: false
  raise_exception: true
  camera:
    eye: [-0.229750, 0.044546, 0.313830]
    target: [0.582159, -0.617558, -0.528879]
