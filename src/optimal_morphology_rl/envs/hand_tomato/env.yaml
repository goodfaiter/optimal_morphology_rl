modules:
  init_modules:
    - create_rigid_vsim_envs
    - termination
    - create_robot
    - articulation_link_colorer
    - create_objects
    - create_kinematic_sensor
    - create_force_sensor
    - create_contacts
  pre_physics_step_modules:
    - robot_control
    - external_force
    - object_control
  pre_gym_step_modules: []
  post_gym_step_modules:
    - goal_visualization
    - render
  post_physics_step_modules:
    - update_robot
    - update_objects
    - update_kinematic_sensor
    - update_force_sensors
    - update_contacts
    - observation
    - reward
    - termination
create_rigid_vsim_envs:
  num_envs: 4096
  device: cuda:0
  enable_scene_query: true
  timestep: 0.008333
  frame_skip: 2
  spacing: 0.75
  gravity:
  - 0.0
  - 0.0
  - -9.81
  up_axis:
  - 0.0
  - 0.0
  - 1.0
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4
create_robot:
  vsim_path: /workspace/data/claw_3.vsim
  fixed_hand: false
  use_tendon: true
create_objects:
  reward_object: tomato
  scene_objects:
  - table
robot_control: {}
create_force_sensor:
  link_names:
  - distal
create_contacts:
  link_names:
  - distal
external_force:
  apply_prob: 0.02
  force_max: 2.0
  torque_max: 0.0
observation:
  num_hist: 3
  hist_stride: 10
  modules:
  - robot_state
  - object_state
  - goal_state
reward:
  goal_position_reward:
    scale: 1.5
    normalize: 0.2
  goal_orientation_reward:
    scale: 1.0
  hand_to_object_distance_reward:
    scale: 0.1
  fingertip_contact_reward:
    scale: 2.0
  action_penalty_reward:
    scale: 0.01
  action_smoothness_reward:
    scale: 0.01
termination:
  progress:
    max_episode_length: 360
  drop_termination:
    threshold: -0.1
  bounds_termination: {}
