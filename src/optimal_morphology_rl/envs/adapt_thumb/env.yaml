# adapt_thumb: adapt_finger for the thumb. The thumb tip (Thumb_DP kinematic sensor) tracks a 3D goal with the
# four thumb spools (CMC1, CMC2, MCP, IP) of the full hand; the finger tendons get no action and the fingers rest on
# their springs. Servo, springs and spool calibration as adapt_cube.

modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - randomize_antagonistic_springs
    - create_spool
    - randomize_joint_friction
    - randomize_spool
    - randomize_link_inertia
    - randomize_m5
    - randomize_spool_velocity
    - create_kinematic_sensor
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - update_spool
    - spool_plot
    - apply_m5_forces
    - antagonistic_spring
    - apply_motor_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_kinematics # forward kinematics after the physics
    - update_robot
    - update_kinematic_sensor
    - reward
    - termination
    - reset_envs
    - observation
    - goal_pose
    - goal_visualization

create_rigid_vsim_envs:
  num_envs: 1024
  num_envs_per_set: 1 # one robot per env set, so joint friction is randomized per env
  # The seed comes from ppo.yaml params.seed (or --seed); see sync_seed in modular_runner.py.
  enhanced_determinism: true # vlearn determinism mode (~1 % slower)
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 1
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_full.vsim
  fixed_hand: true
  fixed_hand_root_pos: [-0.15, -0.15, 0.1]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # Only the thumb tendons get policy actions: the DIP couplings are fixed (FixedTendonMaterial) and the finger
  # tendons are left out the same way (no spool, no force; the fingers rest on their springs).
  fixed_tendon_substrings: ["dip", "index", "middle", "ring", "pinky"]

process_variable_actions:
  # Change of the spool angle [rad] (CMC1, CMC2, MCP, IP): desired = position + action (>= -1 rad); the servo current
  # is 0.1 A/rad * (desired - position). The ranges only scale the unclipped policy output. Up to +2 rad (as
  # adapt_cube): at +1 rad the servo makes 0.025 Nm, less than the thumb's static friction budget (~0.03 Nm at full
  # friction), and the thumb does not move.
  min_dof_scale: [-1, -1, -1, -1]
  max_dof_scale: [2, 2, 2, 2]

apply_motor_forces: {}
apply_root_forces: {}

# Servo spools on the tendon actuator sliders: the prismatic joint is the spool rim
# (theta = q / r) and the slider armature is the servo inertia. Builds the tendon action
# space (replaces 'robot_control_tendons' + 'apply_tendon_forces'). The thumb tendons of the full hand
# (CMC1, CMC2, MCP, IP); the CMC2 routing has extra reduction (6.51 mm, fitted to the robot's thumb_cmc2 ramp, as
# adapt_cube).
create_spool:
  pully_radius: [0.005, 0.00651, 0.005, 0.005] # [m]
  model_tendon_indices: [12, 13, 14, 15]

# Live plot of env 0's spool command, angle and velocity in its own window, in play mode only
# (it can be minimized or closed without affecting the simulation).
spool_plot:
  enabled: ${eval:'mode == "play"'}
  every: 1
  window_s: 5.0

# M5-friction servo law on the spools: slider motor force (tau_motor + tau_friction) / r,
# applied by 'apply_motor_forces'.
apply_m5_forces:
  # friction: False
  friction_model_path: 2026_10_21_mlp_dynamic_envelope.pt # learned tau_f_max(omega, target - theta) instead of the M5 constants
  motor_position_gain: 0.1 # A/rad, current = gain * (target - position), as on the robot
  torque_constant: 0.500 # Nm/A, torque = K_t * sign(i) * max(|i| - i_0, 0)
  current_deadband: 0.0496 # A, i_0
  max_spool_velocity: 7.6 # rad/s, servo speed limit (measured: PWM saturates)
  K_v: 0.0045
  K_c: 0.0024
  K_m: 0.007
  K_e_wind: 0.243
  K_e_unwind: 0.385
  v_s: 0.2
  alpha: 1.6
  K_cs: 0.0028
  K_ms: 0.153
  K_es: 0.260

# Per revolute motor (joint name), Nm/rad, the same in train and play; the CMC2 elastic is pre-tensioned (holds
# the thumb against gravity), as adapt_cube.
antagonistic_spring:
  spring_constants: {default: 0.005}
  spring_preloads: {Thumb_CMC2: 0.030}

# Spring constants within +-10 % of the nominal, per env and motor on reset; nominal in play.
randomize_antagonistic_springs:
  scale: ${eval:'0.1 if mode == "train" else 0.0'}

randomize_joint_friction:
  joint_friction_range: ${eval:'[0.0, 0.1] if mode == "train" else [0.0, 0.0]'}

# Servo spool, per env and tendon on reset: pulley radius and slider armature (reflected rotor inertia J / r^2)
# +-20 % around each tendon's own nominal (CMC2: 6.51 mm); nominal in play. The servo's stop-torque inertia
# J_eff = (armature + slider mass) * r^2 is recomputed after each resample.
randomize_spool:
  pully_radius_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}
  armature_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}

# Hand link masses +-20 % (inertia follows the mass) and an extra +-20 % on the inertia,
# per link and env on reset; nominal in play. Default links: all but the spool sliders.
randomize_link_inertia:
  mass_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}
  inertia_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}

# Servo speed limit of 'apply_m5_forces' per env and tendon on reset (the real servo saturates its PWM
# at ~7.6 rad/s, lower under load); nominal in play.
randomize_spool_velocity:
  max_spool_velocity_range: ${eval:'[6.4, 8.0] if mode == "train" else [7.6, 7.6]'} # rad/s

# Friction of 'apply_m5_forces' (tau_f_max) x U[1 - scale, 1 + scale], one factor per env, redrawn on its reset;
# nominal in play.
randomize_m5:
  scale: ${eval:'0.25 if mode == "train" else 0.0'}

observation:
  num_hist: 25
  hist_stride: 2
  modules:
    spool_state:
      # Observation noise per env and tendon, drawn on reset (the spool command and dynamics are
      # unchanged); none in play. Encoder zero offset of the angle (rad), first-order low-pass lag of
      # the velocity (time constant, s; the control step is 5 ms) and a velocity bias (rad/s).
      noise:
        angle_offset_range: ${eval:'[-0.1, 0.1] if mode == "train" else [0.0, 0.0]'}
        velocity_lag_range: ${eval:'[0.0, 0.02] if mode == "train" else [0.0, 0.0]'}
        velocity_offset_range: ${eval:'[-0.2, 0.2] if mode == "train" else [0.0, 0.0]'}
    goal_finger_tip: {} # the goal in the goal_pose frame (the env frame), within the goal_position ranges below
  # Critic only (rl_games central_value_config in ppo.yaml): the critic sees the observations above plus these
  # sim-only signals of the current step; the deployed policy does not.
  privileged_modules:
    spool_torques:
      signals: [tau_f_max] # friction budget of apply_m5_forces per spool (Nm)

# Goals in the env frame (no frame: not rotated with the palm), a 3D box in the thumb tip's workspace. The workspace
# (tip positions under random spool targets) is a curved shell, ~14 x 6 x 7 cm; this box (4 x 7 x 3 cm) has 62 % of
# its volume within 5 mm of a reached tip position. The envs are split evenly over the goal types (no planar square).
goal_pose:
  goal_position:
    x: [-0.14, -0.03]
    y: [-0.33, -0.15]
    z: [0.145, 0.195]
  goal_orientation: [0, 0, 0, 1]
  types:
    discrete:
      resample_prob: 0.005
    # Per-axis, per-env sinusoid in Hz (all three axes): amp = fraction x half-range, phase in [0, 2pi);
    # dt = timestep x frame_skip (5ms at the current 200Hz control rate).
    sinusoidal:
      sinusoidal:
        min_frequency: 0.2
        max_frequency: 0.8
        min_amplitude_fraction: 0.0
        max_amplitude_fraction: 1.0

reward:
  goal_finger_tip_reward:
    scale: 1.0
    normalize: 0.03
    link_name: "Thumb_DP"
  # action_penalty_reward:
  #   scale: 0.001
  # action_smoothness_reward:
  #   scale: 0.1
  action_oscillation_reward:
    scale: 0.01
    low_hz: 1.0
    high_hz: 10.0

termination:
  progress:
    max_episode_length: 2400

render:
  capped_step: true
  paused: false
  raise_exception: true
