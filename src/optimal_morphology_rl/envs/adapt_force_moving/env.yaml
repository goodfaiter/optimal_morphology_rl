modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - randomize_antagonistic_springs
    - create_spool
    - randomize_joint_friction
    - randomize_spool
    - randomize_link_inertia
    - randomize_m5
    - randomize_spool_velocity
    - create_objects
    - create_kinematic_sensor
    - create_force_sensor
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - update_spool_target
    - spool_plot
  pre_gym_step_modules:
    - finger_path_cylinder # places the cylinder on the finger's curl path and moves it along it (every substep)
    - update_spool
    - apply_m5_forces
    - antagonistic_spring
    - apply_motor_forces
  post_gym_step_modules:
    - update_robot # every substep reads the state the last one reached (joint / tendon states need no forward kinematics)
  post_physics_step_modules:
    - update_kinematics # forward kinematics once per control step, before the kinematic sensors are read
    - update_kinematic_sensor
    - update_force_sensors
    - force_goal
    - force_plot
    - reward
    - termination
    - force_goal_advance # after the reward: the force is scored against the goal the policy saw
    - reset_envs
    - observation
    - camera_recorder

create_rigid_vsim_envs:
  num_envs: 1024
  num_envs_per_set: 1 # one robot per env set, so joint friction is randomized per env
  # The seed comes from ppo.yaml params.seed (or --seed); see sync_seed in modular_runner.py.
  enhanced_determinism: true # vlearn determinism mode (~1 % slower)
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/200} # physics (and servo law) at 200 Hz, as the robot loop
  frame_skip: 10 # physics steps per control (policy) step: 20 Hz control
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_one_middle.vsim
  fixed_hand: true
  fixed_hand_root_pos: [-0.15, -0.15, 0.1]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendon is fixed (FixedTendonMaterial, driven by rigid_tendons) and gets no policy action.
  fixed_tendon_substrings: ["dip"]
  link_friction: 2.0
  # Every episode starts with the finger fully open (no reset_pose).

# The fixed cylinder (radius 12.5 mm, height 15 mm) the middle fingertip presses on (the Bota sensor); its pose comes
# from 'finger_path_cylinder' (position: only where it is created).
create_objects:
  objects:
    cylinder:
      position: [-0.099, -0.172, 0.1475] # m, env frame (center)
  reward_object: cylinder

# The cylinder anywhere along the fingertip's curl path (joints at s x path_end; s = 1: the old palm cylinder's contact
# pose), top face on the path facing the incoming fingertip, so the finger always presses straight down on it. In
# training it moves along the path in most envs (a hand-held sensor pushed toward / pulled away from the finger, up
# to max_speed), with a small tilt and sideways shift; in play it always moves (no tilt / shift).
finger_path_cylinder:
  tip_sensor: Middle_DP
  path_end: {Middle_MCP: 1.3116, Middle_PIP: 1.4436, Middle_DIP: 1.4601}
  s_range: [0.3, 1.0]
  contact_offset: 0.0 # m along the path past the drawn point
  half_height: 0.0075 # m
  tilt_deg: ${eval:'5.0 if mode == "train" else 0.0'}
  lateral_range: ${eval:'0.002 if mode == "train" else 0.0'} # m
  motion:
    static_prob: ${eval:'0.3 if mode == "train" else 0.0'} # envs whose cylinder stays put the whole episode
    max_speed: 0.03 # m/s along the path, drawn per target in [0, max]
    mean_hold_sec: 1.5 # s, exponential time until the next target

# The force sensor on the middle fingertip (Middle_DP, 'contact' flags: the contact forces on the link).
create_force_sensor:
  link_names: ["Middle_DP"]

# Live plot of env 0's target and measured fingertip force in its own window, in play mode only
# (it can be minimized or closed without affecting the simulation).
force_plot:
  enabled: ${eval:'mode == "play"'}
  every: 1
  window_s: 5.0

# One static target: 1 N, the whole episode (discrete over [1, 1], never 0, never redrawn).
force_goal:
  sensor_link: Middle_DP
  force_range: [1.0, 1.0] # N
  types:
    discrete:
      zero_prob: 0.0

# Change of the spool angle [rad] (MCP, PIP): desired = position + action (>= -1 rad); the servo current is
# 0.1 A/rad * (desired - position). The policy output [-1, 1] maps to [min, max] (unclipped).
process_variable_actions:
  min_dof_scale: [-0.75, -0.75]
  max_dof_scale: [0.75, 0.75]

apply_motor_forces: {}

# Servo spools on the tendon actuator sliders: the prismatic joint is the spool rim
# (theta = q / r) and the slider armature is the servo inertia. Builds the tendon action
# space (replaces 'robot_control_tendons' + 'apply_tendon_forces'); the DIP tendon is
# fixed and has no slider.
create_spool:
  pully_radius: 0.005 # [m]
  model_tendon_indices: [0, 1]

# Live plot of env 0's spool command, angle, velocity and torques in its own window, in play mode only
# (it can be minimized or closed without affecting the simulation).
spool_plot:
  enabled: ${eval:'mode == "play"'}
  every: 1
  window_s: 5.0

# Servo law on the spools: slider motor force (tau_m + tau_f) / r, applied by 'apply_motor_forces'. The friction
# budget tau_f_max comes from the learned envelope (friction_model_path, in optimal_morphology_rl_assets/models/
# actuators) instead of the M5 constants below; its motor constants must match the model's (weak gain: K_t 0.5,
# i_0 0.05; 2026_11_10_mlp_dynamic_envelope_tau_e.pt, which also predicts tau_e: 0.52, 0.0487).
apply_m5_forces:
  friction_model_path: 2026_11_13_mlp_dynamic_envelope_weak_gain.pt
  motor_position_gain: 0.1 # A/rad, current = gain * (target - position), as on the robot
  torque_constant: 0.5 # Nm/A, torque = K_t * sign(i) * max(|i| - i_0, 0)
  current_deadband: 0.05 # A, i_0
  max_spool_velocity: 7.6 # rad/s, servo speed limit (measured: PWM saturates)
  command_delay_steps: 0 # ${eval:'[0, 4] if mode == "train" else 0'} # [0, 4]
  # M5 constants (used without friction_model_path)
  K_v: 0.0015
  K_c: 0.0064
  K_m: 0.028
  K_e_wind: 0.334
  K_e_unwind: 0.334
  v_s: 0.2
  alpha: 1.6
  K_cs: 0.0065
  K_ms: 0.037
  K_es: 0.225

# Per revolute motor (Abd, MCP, PIP, DIP; the free Abd joint has no tendon, only this spring), Nm/rad, the same in
# train and play.
antagonistic_spring:
  spring_constants: {default: 0.005}

# Spring constants within +-10 % of the nominal, per env and motor on reset; nominal in play.
randomize_antagonistic_springs:
  scale: ${eval:'0.1 if mode == "train" else 0.0'}

randomize_joint_friction:
  joint_friction_range: ${eval:'[0.0, 0.1] if mode == "train" else [0.0, 0.0]'}

# Servo spool, per env and tendon on reset: pulley radius +-10 % around 5 mm and slider armature
# (reflected rotor inertia J / r^2) +-20 % around the vsim's 48 kg (J = 0.0012 kg m^2); nominal in play. The
# servo's stop-torque inertia J_eff = (armature + slider mass) * r^2 is recomputed after each resample.
randomize_spool:
  pully_radius_range: ${eval:'[0.0045, 0.0055] if mode == "train" else [0.005, 0.005]'}
  armature_range: ${eval:'[38.4, 57.6] if mode == "train" else [48.0, 48.0]'}

# Finger link masses +-20 % (inertia follows the mass) and an extra +-20 % on the inertia,
# per link and env on reset; nominal in play. Default links: all but the spool sliders.
randomize_link_inertia:
  mass_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}
  inertia_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}

# Servo speed limit of 'apply_m5_forces' per env and tendon on reset (the real servo saturates its PWM
# at ~7.6 rad/s, lower under load); nominal in play.
randomize_spool_velocity:
  max_spool_velocity_range: ${eval:'[6.4, 8.0] if mode == "train" else [7.6, 7.6]'} # rad/s

# Friction of 'apply_m5_forces' (tau_f_max) x U[1 - scale * c, 1 + scale * c] at curriculum factor c, one factor per
# env, redrawn on its reset; nominal in play. 0.25: x U[0.75, 1.25] at curriculum 1.0.
randomize_m5:
  scale: ${eval:'0.25 if mode == "train" else 0.0'}

observation:
  num_hist: 25 # history frames (the network input size)
  hist_period: 0.05 # s between frames: every control step at 20 Hz, 1.25 s of history
  modules:
    spool_state: {} # the spool angles and velocities (rad, rad/s)
    spool_action: {} # the policy's commanded change of the spool angle (rad)
    force_goal: {} # the target fingertip force (N)
    spool_torques:
      signals: ["tau_e", "tau_f", "tau_inertia", "tau_m", "tau_f_max"]
    fingertip_force: {} # the measured fingertip force (N; the robot: the Bota |F|): where the moving sensor is
  privileged_modules:
    object_state:
      signals: [pos, rot] # the cylinder's pose (critic only)

reward:
  # Sum over the widths of exp(-((fingertip force - target) / normalize)^2): up to one per width (3 here) per step.
  # With allow_overshoot a force up to target + overshoot_tolerance counts as on target; beyond it the error counts
  # from there.
  force_tracking_reward:
    scale: 1.0
    normalize: [0.2, 0.1, 0.05] # N [0.5, 0.3, 0.1] # N
    allow_overshoot: True
    overshoot_tolerance: 0.1 # N
  # exp(-(distance / normalize)^2) from the fingertip (DP tip) to the cylinder's top face center; always on
  # (only_with_goal: false), so the fingertip also rests on the cylinder at 0 N instead of moving away.
  fingertip_guide_reward:
    scale: 0.1
    normalize: 0.08 # m
    tip_sensor: Middle_DP
    target_offset: [0.0, 0.0, 0.0075] # m, the top face (cylinder height 15 mm)
    only_with_goal: false

termination:
  progress:
    max_episode_sec: 12.0 # s (any frame_skip)

camera_recorder:
  enabled: False
  camera_rig: camera_rig
  fps: 30

render:
  capped_step: true
  paused: false
  raise_exception: true
  camera:
    eye: [-0.310728, 0.179221, 0.331265]
    target: [0.654746, -0.647702, -0.389602]
