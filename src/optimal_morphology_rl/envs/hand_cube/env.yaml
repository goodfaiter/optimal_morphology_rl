modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - color_articulation_links
    - create_objects
    - create_kinematic_sensor
  pre_physics_step_modules:
    - process_actions
    - robot_control
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - update_objects
    - update_kinematic_sensor
    - observation
    - reward
    - termination
    - goal_visualization
    - render
create_rigid_vsim_envs:
  num_envs: 4096
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/120}
  frame_skip: 2
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4
create_robot:
  vsim_path: /workspace/data/claw_3.vsim
  fixed_hand: true
  use_tendon: true
  randomize_pose: false
  friction_coefficient: 0.8
create_objects:
  reward_object: cube
  scene_objects:
  - table
process_actions: {}
robot_control: {}
observation:
  num_hist: 3
  hist_stride: 10
  modules:
  - robot_state
  - object_state
  - goal_state
reward:
  cube_orientation_reward:
    scale: 1.0
  action_penalty_reward:
    scale: 0.01
  action_smoothness_reward:
    scale: 0.01
termination:
  progress:
    max_episode_length: 360
  drop_termination:
    threshold: 0.09
    reward_scale: -20.0
  bounds_termination:
    reward_scale: -10.0
  cube_success_termination:
    success_scale: 200.0
