modules:
  - create_rigid_vsim_envs
  - robot
  - object_generator
  - robot_control
  - kinematic_sensor
  - force_sensors
  - contacts
  - observation
  - reward
  - termination

create_rigid_vsim_envs:
  num_envs: 4096
  device: cuda:0
  rendering: false
  enable_scene_query: true
  with_window: false
  max_episode_length: 360
  timestep: 0.008333
  frame_skip: 2
  spacing: 0.5
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

robot:
  vsim_path: /workspace/data/claw_3.vsim
  fixed_hand: true
  use_tendon: true

object_generator:
  reward_object: cube
  scene_objects:
    - table

robot_control: {}

force_sensors:
  link_names:
    - distal

contacts:
  link_names:
    - distal

observation:
  num_hist: 3
  hist_stride: 10
  modules:
    - robot_state
    - object_state
    - goal_state

reward:
  cube_orientation_success_reward:
    scale: 1.0
    success_scale: 200.0
  action_penalty_reward:
    scale: 0.01
  action_smoothness_reward:
    scale: 0.01

termination:
  drop_termination:
    threshold: 0.09
  bounds_termination: {}
  cube_success_termination: {}
