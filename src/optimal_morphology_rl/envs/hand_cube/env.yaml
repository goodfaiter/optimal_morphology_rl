modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - randomize_friction
    - color_articulation_links
    - create_objects
    - create_kinematic_sensor
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - antagonistic_spring
    - robot_control_tendons
    - apply_tendon_forces
    - apply_motor_forces
    - gravity_compensation
    - apply_root_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - update_objects
    - update_kinematic_sensor
    - observation
    - reward
    - termination
    - goal_visualization
create_rigid_vsim_envs:
  num_envs: 4096
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/120}
  frame_skip: 2
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4
create_robot:
  vsim_path: /workspace/data/claw_3.vsim
  fixed_hand: true
  use_tendon: true
  randomize_pose: false
create_objects:
  objects: [table, cube]
  reward_object: cube
process_variable_actions:
  min_dof_scale: -0.25
  max_dof_scale: 10.0
robot_control_tendons: {}
apply_tendon_forces: {}
apply_motor_forces: {}
gravity_compensation: {}
apply_root_forces: {}

randomize_friction:
  friction_coefficient: 0.8

antagonistic_spring:
  spring_constants: 0.1
observation:
  num_hist: 3
  hist_stride: 10
  modules:
  - robot_state
  - object_state
  - goal_state
reward:
  cube_orientation_reward:
    scale: 1.0
  action_penalty_reward:
    scale: 0.01
  action_smoothness_reward:
    scale: 0.01
termination:
  progress:
    max_episode_length: 360
  drop_termination:
    threshold: 0.09
    reward_scale: -20.0
  bounds_termination:
    reward_scale: -10.0
  cube_success_termination:
    success_scale: 200.0
