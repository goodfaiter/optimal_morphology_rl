# Full ADAPT hand (Hand_GeomOpt_MJCF_Short.urdf -> adapt_hand_v4_full.vsim) for interactive testing:
# no goal, no randomization. Regenerate the vsim with
#   uv run python3 -m optimal_morphology_rl_assets.urdf_to_vsim
# (its hard-coded configuration targets the full hand). The finger abduction joints are fixed by the
# converter; the thumb's CMC3 twist about its extension axis is a fixed joint in the URDF itself, at
# 0.384 rad as in the source MJCF. Only the four fingers have tendons for now (TENDON_DIGITS): the
# converter's thumb routing does not fit this thumb (it blows up the whole articulation), so the thumb
# is passive on its return springs until its tendon routing is defined.
# Run with:  omrl adapt_hand --mode interactive
modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - create_spool
    - termination
    - render
  pre_physics_step_modules:
    - render
    - interactive_slider_control
    - process_variable_actions
    - create_spool
    - spool_plot
    - apply_m5_forces
    - antagonistic_spring
    - apply_motor_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - observation
    - reward
    - termination

create_rigid_vsim_envs:
  num_envs: 1
  device: cuda:0
  rendering: true
  with_window: true
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 1
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 256
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_full.vsim
  fixed_hand: true
  fixed_hand_root_pos: [0.0, 0.0, 0.2]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The dip tendons are fixed-length couplings (FixedTendonMaterial) and get no action.
  fixed_tendon_substrings: ["dip"]
  passive_motor_substrings: []

# Finite-difference velocities for the apply_m5_forces stop torque and the robot_state observation.
update_robot:
  velocity_source: fd

apply_motor_forces: {}

# One slider drives every spool (mcp + pip of the four fingers) to the same angle, in rad:
# the identity action scaling below makes the slider value the spool angle target.
interactive_slider_control:
  slider_min: 0.0
  slider_max: 4.0
  shared: true

process_variable_actions:
  min_dof_scale: -1.0
  max_dof_scale: 1.0

# Servo spools on every policy-controlled tendon (mcp + pip of each finger).
create_spool:
  pully_radius: 0.005 # [m]

# Live plot of every spool's command, angle and velocity (env 0) in its own window; it can be
# minimized or closed without affecting the simulation.
spool_plot:
  every: 2
  window_s: 5.0

apply_m5_forces:
  motor_gain: 0.0389 # Nm/rad
  K_v: 0.002
  K_c: 0.014
  K_m: 0.11
  K_e: 0.12
  v_s: 0.09
  alpha: 1.6
  K_cs: 0.005
  K_ms: 0.09
  K_es: 0.03

# Return springs on every revolute joint (also the thumb CMC joints, which the thumb mcp tendon pulls).
antagonistic_spring:
  spring_constant_range: [0.005, 0.005]

observation:
  num_hist: 1
  hist_stride: 1
  modules:
    robot_state: {}

reward: {}

termination:
  progress:
    max_episode_length: 1000000

render:
  capped_step: false
  paused: false
  raise_exception: true
  camera:
    eye: [0.25, 0.25, 0.35]
    target: [0.0, 0.0, 0.2]
