modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - create_spool
    - termination
    - render
  pre_physics_step_modules:
    - render
    - interactive_slider_control
    - process_variable_actions
    - create_spool
    - apply_m5_forces
    - spool_plot
    - antagonistic_spring
    - apply_motor_forces
    - apply_root_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - observation
    - reward
    - termination

create_rigid_vsim_envs:
  num_envs: 1
  device: cuda:0
  rendering: true
  with_window: true
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 1
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

# Full hand (urdf_to_vsim.py full): 12 servo tendons as on the robot, mcp + pip per finger and one per thumb joint
# (CMC1, CMC2, MCP, IP); the finger dip tendons are fixed (PIP -> DIP coupling).
create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_full.vsim
  fixed_hand: true
  fixed_hand_root_pos: [0.0, 0.0, 0.2]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendons are fixed (FixedTendonMaterial) and get no action.
  fixed_tendon_substrings: ["dip"]
  # Make every motor controllable from the UI (no passive motors).
  passive_motor_substrings: []

# Finite-difference velocities for the apply_m5_forces stop torque and the robot_state observation.
update_robot:
  velocity_source: fd

apply_motor_forces: {}
apply_root_forces: {}

interactive_slider_control:
  slider_min: -3
  slider_max: 3

process_variable_actions:
  min_dof_scale: -1 # change of the spool angle [rad] per spool, as in adapt_finger
  max_dof_scale: 1

# Servo spools on the tendon actuator sliders: the prismatic joint is the spool rim (theta = q / r) and the slider
# armature is the servo inertia. Builds the tendon action space; the dip tendons are fixed and have no slider.
# Tendon order of the vsim: Index mcp/pip/dip 0-2, Middle 3-5, Ring 6-8, Pinky 9-11, Thumb cmc1/cmc2/mcp/ip 12-15.
create_spool:
  pully_radius: 0.005 # [m]
  model_tendon_indices: [0, 1, 3, 4, 6, 7, 9, 10, 12, 13, 14, 15]

# Live plot of every spool's command, angle, velocity and torques (env 0) in its own window; it can be minimized or
# closed without affecting the simulation.
spool_plot:
  every: 2
  window_s: 5.0

# M5-friction servo law on the spools (as adapt_finger): slider motor force (tau_motor + tau_friction) / r, applied
# by 'apply_motor_forces'. The action is the change of the spool angle: desired = max(theta + action, -1).
apply_m5_forces:
  friction_model_path: mlp_dynamic_envelope.pt # learned tau_f_max(omega, target - theta)
  friction_model_output: envelope # the budget tau_f_max of the stick logic (torque: a signed tau_f applied as is)
  motor_position_gain: 0.1 # A/rad, current = gain * (target - position), as on the robot
  torque_constant: 0.500 # Nm/A, torque = K_t * sign(i) * max(|i| - i_0, 0)
  current_deadband: 0.0496 # A, i_0
  max_slider_velocity: 0.038 # m/s, servo speed limit (7.6 rad/s at a 5 mm pulley, measured: PWM saturates)
  K_v: 0.0045
  K_c: 0.0024
  K_m: 0.007
  K_e_wind: 0.243
  K_e_unwind: 0.385
  v_s: 0.2
  alpha: 1.6
  K_cs: 0.0028
  K_ms: 0.153
  K_es: 0.260

# One spring constant for every revolute motor (Nm/rad), as adapt_finger.
antagonistic_spring:
  spring_constants: 0.005

observation:
  num_hist: 1
  hist_stride: 1
  modules:
    robot_state: {}

reward: {}

termination:
  progress:
    max_episode_length: 1000000

render:
  capped_step: false
  paused: false
  raise_exception: true
  camera:
    eye: [0.049792, 0.161890, 0.291726]
    target: [0.586387, -0.742233, -0.324408]
