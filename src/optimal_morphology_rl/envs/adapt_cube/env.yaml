modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - randomize_antagonistic_springs
    - create_spool
    - randomize_joint_friction
    - randomize_spool
    - randomize_link_inertia
    - randomize_m5
    - randomize_spool_velocity
    - create_objects
    - randomize_object
    - randomize_robot_friction
    - color_articulation_links
    - create_kinematic_sensor
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - update_spool
    - apply_m5_forces
    # - spool_plot
    - antagonistic_spring
    - apply_motor_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_kinematics # forward kinematics after the physics
    - update_robot
    - update_objects
    - update_kinematic_sensor
    - goal_pose
    - reward
    - termination
    - reset_envs
    - observation
    - goal_visualization
    - camera_recorder

create_rigid_vsim_envs:
  num_envs: 1024
  device: cuda:0
  timestep: ${1/200}
  frame_skip: 1 # 200 Hz control, as the robot loop and the friction model

# Full hand (urdf_to_vsim.py full): 12 servo tendons as on the robot, mcp + pip per finger and one per thumb joint
# (CMC1, CMC2, MCP, IP); the finger dip tendons are fixed (PIP -> DIP coupling).
create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_full.vsim
  fixed_hand: true
  self_collisions: true
  fixed_hand_root_pos: [-0.15, -0.15, 0.1]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendons are fixed (FixedTendonMaterial) and get no policy action.
  fixed_tendon_substrings: ["dip"]

create_objects:
  objects:
    cube:
      asset: cube_mid_mesh # the 5 cm cube as a convex mesh (same sim speed as the box primitive cube_mid)
      init_position: [-0.05, -0.15, 0.2]
      init_orientation: [0.0, 0.0, 0.0, 1.0] # identity (xyzw), every reset
      # init_orientation: 'random'
      init_angular_velocity: [0.0, 0.0, 0.0] # rad/s about env z (up, out of the palm), on every reset
  reward_object: cube

randomize_object:
  mass_scale_range: ${eval:'[0.7, 1.3] if mode == "train" else [1.0, 1.0]'}
  inertia_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}

# Hand-object contact friction per env on reset (contact = average of the materials; the cube's is 0, so the hand's
# material gets 2x); nominal in play: create_robot link_friction (default 1.0) / 2 = 0.5.
randomize_robot_friction:
  friction_range: ${eval:'[0.75, 3.5] if mode == "train" else [3.0, 3.0]'}

# Render colors (visual only): one generated palette color per digit (link-name group) and one for the cube.
color_articulation_links:
  exclude_substrings: [_abd, _base, slider]

# Video of env 0 in play mode: PNG frames of the camera rig's cameras (camera_side, camera_top) at ~30 fps in
# <run>/videos/<checkpoint>_<time>/, turned by ffmpeg at the end into <run>/<checkpoint>_<time>_<camera>.mp4.
camera_recorder:
  enabled: False # ${eval:'mode == "play"'}
  camera_rig: camera_rig
  frame_stride: 7 # 200 Hz / 7 = 28.6 fps

# Fixed goal at the cube's rest point on the open palm (5 cm cube): the rotation reward's position gate, the hold reward
# and cube_away_termination measure the cube's distance to it. (3 cm cube, cube_30_mesh: (-0.056, -0.154, 0.150).)
goal_pose:
  goal_position:
    x: [-0.058, -0.058]
    y: [-0.156, -0.156]
    z: [0.162, 0.162]
  goal_orientation: [0, 0, 0, 1]
  types:
    discrete:
      resample_prob: 0.005

process_variable_actions:
  # Change of the spool angle [rad] per spool: desired = position + action (>= -1 rad); the servo current is
  # 0.1 A/rad * (desired - position). The ranges only scale the unclipped policy output.
  min_dof_scale: -1
  max_dof_scale: 2

apply_motor_forces: {}

# Servo spools on the tendon actuator sliders: the prismatic joint is the spool rim (theta = q / r) and the slider
# armature is the servo inertia. Builds the tendon action space; the dip tendons are fixed and have no slider.
# Tendon order of the vsim: Index mcp/pip/dip 0-2, Middle 3-5, Ring 6-8, Pinky 9-11, Thumb cmc1/cmc2/mcp/ip 12-15.
create_spool:
  # m, per model tendon (Index, Middle, Ring, Pinky mcp / pip, Thumb cmc1 / cmc2 / mcp / ip): the thumb CMC2 routing
  # (pulley) has extra reduction (urdf_to_vsim SPOOL_RADII, its slider armature is J / r^2): 6.51 mm puts its 80 deg stop
  # at the robot's spool angle (2026-10-30 thumb_cmc2 trial).
  pully_radius: [0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.00651, 0.005, 0.005]
  model_tendon_indices: [0, 1, 3, 4, 6, 7, 9, 10, 12, 13, 14, 15]

# Live plot of env 0's spool command, angle, velocity and torques in its own window, in play mode only (it can be
# minimized or closed without affecting the simulation).
spool_plot:
  enabled: ${eval:'mode == "play"'}
  every: 1
  window_s: 5.0
  # Index finger MCP and PIP spools (create_spool order); its DIP has no spool (coupled to the PIP by a fixed tendon).
  spools: [0, 1]

# M5-friction servo law on the spools (as adapt_finger): slider motor force (tau_motor + tau_friction) / r, applied
# by 'apply_motor_forces'.
apply_m5_forces:
  friction: True
  friction_model_path: 2026_10_21_mlp_dynamic_envelope.pt # learned tau_f_max(omega, target - theta) instead of the M5 constants
  motor_position_gain: 0.1 # A/rad, current = gain * (target - position), as on the robot
  torque_constant: 0.500 # Nm/A, torque = K_t * sign(i) * max(|i| - i_0, 0)
  current_deadband: 0.0496 # A, i_0
  max_spool_velocity: 7.6 # rad/s, servo speed limit (measured: PWM saturates), the same for every spool radius
  K_v: 0.0045
  K_c: 0.0024
  K_m: 0.007
  K_e_wind: 0.243
  K_e_unwind: 0.385
  v_s: 0.2
  alpha: 1.6
  K_cs: 0.0028
  K_ms: 0.153
  K_es: 0.260

# Per joint (revolute motor name; 'default' for the others): Nm/rad and pretension (Nm, >= 0: holds the joint at its
# extension stop; the elastic only resists flexion).
# Thumb CMC1 / CMC2: compared with position-mode ramps + steps on the robot with the learned friction on (2026-10-30,
# runs/robot_trials/2026_10_30_11_23_42_thumb_cmc1_compare sim_nf_point, .._13_02_17_thumb_cmc2_compare sim_cmc2_80deg_pre010):
# the default spring. CMC1 no pretension (any resisting elastic only delays its breakaway further). CMC2 0.010 Nm: palm
# up, gravity flexes CMC2 once CMC1 is up (up to 7.5 mNm at CMC1 90 deg, MCP / IP curled); without it CMC2 falls to
# its 80 deg stop (with CMC1 at 0 its axis is vertical: no load; the fit to the robot ramp moves from spool RMS 0.41
# to 0.56, sim_cmc2_80deg_pre0 / _pre010).
# Thumb MCP / IP pretension: hold the thumb straight against gravity and match the robot's breakaway current (MCP / IP
# ramps, 2026-10-23).
antagonistic_spring:
  spring_constants: {default: 0.005}
  spring_preloads: {Thumb_CMC2: 0.030}

# Spring constants within +-10 % of the nominal, per env and motor on reset; nominal in play.
randomize_antagonistic_springs:
  scale: ${eval:'0.1 if mode == "train" else 0.0'}

randomize_joint_friction:
  joint_friction_range: ${eval:'[0.0, 0.1] if mode == "train" else [0.0, 0.0]'}

# Servo spool, per env and tendon on reset: pulley radius +-20 % around each tendon's pully_radius and slider armature
# (reflected rotor inertia J / r^2, J = 0.0012 kg m^2) +-20 % around the vsim's; nominal in play. The servo's
# stop-torque inertia J_eff = (armature + slider mass) * r^2 is recomputed after each resample.
randomize_spool:
  pully_radius_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}
  armature_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}

# Hand link masses +-20 % (inertia follows the mass) and an extra +-20 % on the inertia, per link and env on reset;
# nominal in play. Default links: all but the spool sliders.
randomize_link_inertia:
  mass_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}
  inertia_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}

# Servo speed limit of 'apply_m5_forces' per env and tendon on reset (the real servo saturates its PWM at ~7.6 rad/s,
# lower under load); nominal in play.
randomize_spool_velocity:
  max_spool_velocity_range: ${eval:'[6.4, 8.0] if mode == "train" else [7.6, 7.6]'} # rad/s

# Friction of 'apply_m5_forces' (tau_f_max) x U[1 - scale, 1 + scale], one factor per env, redrawn on its reset;
# nominal in play.
randomize_m5:
  scale: ${eval:'0.25 if mode == "train" else 0.0'}

observation:
  num_hist: 10
  hist_stride: 5
  modules:
    spool_state:
      # Observation noise per env and tendon, drawn on reset (the spool command and dynamics are unchanged); none in
      # play. Encoder zero offset of the angle (rad), first-order low-pass lag of the velocity (time constant, s; the
      # control step is 5 ms) and a velocity bias (rad/s).
      noise:
        angle_offset_range: ${eval:'[-0.1, 0.1] if mode == "train" else [0.0, 0.0]'}
        velocity_lag_range: ${eval:'[0.0, 0.02] if mode == "train" else [0.0, 0.0]'}
        velocity_offset_range: ${eval:'[-0.2, 0.2] if mode == "train" else [0.0, 0.0]'}
  # Critic only (rl_games central_value_config in ppo.yaml): the critic sees the observations above plus these
  # sim-only signals of the current step; the deployed policy does not.
  privileged_modules:
    spool_torques:
      signals: [tau_f_max] # friction budget of apply_m5_forces per spool (Nm)
    object_state:
      signals: [rot, lin_vel, ang_vel] # cube orientation (6D) and velocities in the hand's robot frame

reward:
  # Small hold reward: keeps the cube on the palm (larger, e.g. 0.25, and the policy stops spinning to hold it).
  goal_position_reward:
    scale: 0.1
    normalize: 0.03
  # exp(-((min(speed about axis, target_speed) - target_speed) / normalize)^2), 1 at or above the target, speed from the finite difference of the cube's orientation.
  # Best setup so far (runs/adapt_cube/2026_10_26_10_42_37 and seeds, 2026-10-26): spin +z (easier than -z), speed over
  # 0.2 s (a vibration earns nothing), reward only near the rest point (spinning the cube off the palm earns nothing).
  cube_angular_velocity_reward:
    axis: [0.0, 0.0, 1.0]
    target_speed: -0.5 # rad/s: spin -z (the thumb curls and turns the cube)
    normalize: 0.25 # rad/s
    scale: 1.0
    capped: True # faster than target_speed is not penalized (False: overshoot is, e.g. to track the speed)
    rate_window: 0.2 # s
    position_gate: 0.04 # m
  # cube_linear_velocity_penalty_reward:
  #   scale: 1.0
  # action_oscillation_reward:
  #   scale: 0.01
  #   low_hz: 1.0
  #   high_hz: 10.0

termination:
  progress:
    max_episode_length: 1600 # 8 [s] at the 200 Hz control step
  # drop_termination:
  #   threshold: 0.09
  #   reward_scale: -20.0
  # Ends the episode when the cube is pushed more than 5 cm from its rest point; -200 so flinging it off is never worth it.
  cube_away_termination:
    max_distance: 0.1
    reward_scale: -40.0
