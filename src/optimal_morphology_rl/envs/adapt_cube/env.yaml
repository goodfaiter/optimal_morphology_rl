modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - create_objects
    - create_kinematic_sensor
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - tendon_est
    - rigid_tendons
    - antagonistic_spring
    - robot_control_tendons
    - apply_tendon_forces
    - apply_motor_forces
    - gravity_compensation
    - apply_root_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - update_objects
    - update_kinematic_sensor
    - goal_pose_discrete
    - observation
    - reward
    - termination
    - goal_visualization

create_rigid_vsim_envs:
  num_envs: 4096
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 2
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/Hand_GeomOpt_MJCF_Short.vsim
  fixed_hand: true
  fixed_hand_root_pos: [-0.15, -0.15, 0.1]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendon is fixed (FixedTendonMaterial, driven by rigid_tendons) and gets no policy action.
  fixed_tendon_substrings: ["dip"]

create_objects:
  objects:
    cube:
      init_position: [-0.05, -0.15, 0.2]
      init_orientation: 'random'
  reward_object: cube

goal_pose_discrete:
  goal_position:
    x: [-0.05, -0.05]
    y: [-0.15, -0.15]
    z: [0.2, 0.2]
  goal_orientation: [0, 0, 0, 1]
  resample_prob: 0.005

process_variable_actions:
  min_dof_scale: -0.2
  max_dof_scale: 0.2

robot_control_tendons: {}
apply_tendon_forces: {}
apply_motor_forces: {}
gravity_compensation: {}
apply_root_forces: {}

# Spring-transformer model forces for the MCP/PIP tendons (model-driven);
# the DIP tendon is rigid (driven by rigid_tendons).
tendon_est:
  pully_radius: 0.011
  model_tendon_indices: [0, 1]
  zero_offset_length: [0.057, 0.040]

rigid_tendons: {}

antagonistic_spring:
  spring_constants: 0.1

observation:
  num_hist: 3
  hist_stride: 10
  modules:
  - robot_state
  - object_state

reward:
  goal_position_reward:
    scale: 0.5
    normalize: 0.1
  cube_angular_velocity_reward:
    scale: 1.0
  # cube_linear_velocity_penalty_reward:
  #   scale: 1.0
  action_penalty_reward:
    scale: 0.01
  action_smoothness_reward:
    scale: 0.01

termination:
  progress:
    max_episode_length: 360
  drop_termination:
    threshold: 0.09
    reward_scale: -200.0
