modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - randomize_friction
    - color_articulation_links
    - create_objects
    - create_kinematic_sensor
    - create_force_sensor
    - create_contacts
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - robot_control_floating_hand
    - antagonistic_spring
    - robot_control_tendons
    - external_force
    - apply_tendon_forces
    - apply_motor_forces
    - apply_root_velocity
    - gravity_compensation
    - apply_root_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - update_objects
    - update_kinematic_sensor
    - update_force_sensors
    - update_contacts
    - observation
    - reward
    - termination
    - goal_visualization
create_rigid_vsim_envs:
  num_envs: 4096
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/120}
  frame_skip: 2
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4
create_robot:
  vsim_path: /workspace/data/claw_3.vsim
  fixed_hand: false
  use_tendon: true
  randomize_pose: false
create_objects:
  objects: [table, tomato_extreme]
  reward_object: tomato_extreme
process_variable_actions:
  min_velocity: [-1.0, -1.0, -1.0, -0.2, -0.2, -0.2]
  max_velocity: [1.0, 1.0, 1.0, 0.2, 0.2, 0.2]
  min_dof_scale: -0.25
  max_dof_scale: 10.0
robot_control_floating_hand: {}
robot_control_tendons: {}
apply_tendon_forces: {}
apply_motor_forces: {}
apply_root_velocity: {}
gravity_compensation: {}
apply_root_forces: {}

randomize_friction:
  friction_coefficient: ${eval:'None if mode == "train" else 0.1'}

antagonistic_spring:
  spring_constants: 0.1
create_force_sensor:
  link_names:
  - distal
create_contacts:
  link_names:
  - distal
external_force:
  apply_prob: 0.02
  force_max: 2.0
  torque_max: 0.0
observation:
  num_hist: 3
  hist_stride: 10
  modules:
  - robot_state
  - object_state
  - goal_state
reward:
  goal_position_reward:
    scale: 1.5
    normalize: 0.1
  goal_orientation_reward:
    scale: 1.0
  hand_to_object_distance_reward:
    scale: 0.1
  fingertip_contact_reward:
    scale: 2.0
  action_penalty_reward:
    scale: 0.01
  action_smoothness_reward:
    scale: 0.01
termination:
  progress:
    max_episode_length: 360
  drop_termination:
    threshold: -0.1
    reward_scale: -20.0
  bounds_termination:
    reward_scale: -10.0
