modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - randomize_joint_friction
    - create_kinematic_sensor
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - prismatic_force_m5
    - antagonistic_spring
    - apply_motor_forces
    - apply_root_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - update_kinematic_sensor
    - observation
    - reward
    - termination
    - goal_pose
    - goal_visualization

create_rigid_vsim_envs:
  num_envs: 1024
  num_envs_per_set: 1 # one robot per env set, so joint friction is randomized per env
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 1
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_one_finger.vsim
  fixed_hand: true
  fixed_hand_root_pos: [-0.15, -0.15, 0.1]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendon is fixed (FixedTendonMaterial, driven by rigid_tendons) and gets no policy action.
  fixed_tendon_substrings: ["dip"]

process_variable_actions:
  min_dof_scale: 0.0
  max_dof_scale: 3.3 # spool target [rad]: full MCP / PIP curl takes ~3.28 rad of command

# Finite-difference velocities for the prismatic_force_m5 stop torque and the robot_state observation.
update_robot:
  velocity_source: fd

apply_motor_forces: {}
apply_root_forces: {}

# Servo spool model (M5 friction) driving the tendon actuator sliders: the prismatic
# joint is the spool rim (theta = q / r), the slider armature is the servo inertia, and
# the slider motor force is (tau_motor + tau_friction) / r. Builds the tendon action
# space itself (replaces 'robot_control_tendons' + 'apply_tendon_forces'); the DIP
# tendon is fixed and has no slider. Alternative to 'tendon_force_m5'/'tendon_est'.
prismatic_force_m5:
  pully_radius: 0.005 # [m]
  model_tendon_indices: [0, 1]
  # friction_model_path: 2026_10_14_m5_mlp_common_friction.pt
  motor_gain: 0.0389 # Nm/rad
  K_v: 0.002
  K_c: 0.014
  K_m: 0.11
  K_e: 0.12
  v_s: 0.09
  alpha: 1.6
  K_cs: 0.005
  K_ms: 0.09
  K_es: 0.03

antagonistic_spring:
  spring_constant_range: ${eval:'[0.0025, 0.0075] if mode == "train" else [0.005, 0.005]'}

# One friction value per env set, resampled when an env of the set resets
# (per env and per episode with create_rigid_vsim_envs.num_envs_per_set: 1).
randomize_joint_friction:
  joint_friction_range: ${eval:'[0.0, 0.0375] if mode == "train" else [0.0, 0.0]'}

observation:
  num_hist: 40
  hist_stride: 10
  modules:
  - spool_state
  - goal_finger_tip

# Goals in the Pinky_Abd frame, the last fixed frame before the MCP joint (vlearn merges it into
# Palm; its pose is composed from the vsim joints). The MCP flexes about Abd -y, so the fingertip
# moves in the Abd x/z plane (DP at y = 5.5 mm at zero pose). The rectangle is the largest one
# whose edge stays within the fingertip workspace at full curl (MCP, PIP up to pi/2).
# The envs are split evenly over the goal types.
goal_pose:
  frame: Pinky_Abd
  goal_position:
    x: [-0.0083, 0.0616]
    y: [0.0055, 0.0055]
    z: [0.0259, 0.0594]
  goal_orientation: [0, 0, 0, 1]
  types:
    square:
      plane: [0, 2]
      speed:
        min: 0.001
        max: 0.05
    discrete:
      resample_prob: 0.005
    # Per-axis, per-env sinusoid in Hz: amp = fraction x half-range, phase in [0, 2pi);
    # dt = timestep x frame_skip (5ms at the current 200Hz control rate).
    sinusoidal:
      sinusoidal:
        min_frequency: 0.2
        max_frequency: 0.8
        min_amplitude_fraction: 0.0
        max_amplitude_fraction: 1.0

reward:
  goal_finger_tip_reward:
    scale: 1.0
    normalize: 0.02
    link_name: "DP"
  action_penalty_reward:
    scale: 0.001
  action_smoothness_reward:
    scale: 0.001

termination:
  progress:
    max_episode_length: 1200

render:
  capped_step: true
  paused: false
  raise_exception: true
  camera:
    eye: [-0.310728, 0.179221, 0.331265]
    target: [0.654746, -0.647702, -0.389602]