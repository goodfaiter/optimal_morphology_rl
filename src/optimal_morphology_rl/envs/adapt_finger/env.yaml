modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - create_kinematic_sensor
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - tendon_est
    - rigid_tendons
    - antagonistic_spring
    - robot_control_tendons
    - apply_tendon_forces
    - apply_motor_forces
    - apply_root_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - update_kinematic_sensor
    - observation
    - reward
    - termination
    - goal_pose_square
    - goal_visualization

create_rigid_vsim_envs:
  num_envs: 1024
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 2
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/Hand_GeomOpt_MJCF_Short_one_finger.vsim
  fixed_hand: true
  fixed_hand_root_pos: [-0.15, -0.15, 0.1]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendon is fixed (FixedTendonMaterial, driven by rigid_tendons) and gets no policy action.
  fixed_tendon_substrings: ["dip"]

process_variable_actions:
  min_dof_scale: -5.0
  max_dof_scale: 5.0

robot_control_tendons: {}
apply_tendon_forces: {}
apply_motor_forces: {}
apply_root_forces: {}

# Spring-transformer model forces for the MCP/PIP tendons (model-driven);
# the DIP tendon is rigid (driven by rigid_tendons).
tendon_est:
  model_path: "/workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/models/actuators/2026_09_24_spring_transformer_frozen_finger.pt"
  pully_radius: 0.011
  model_tendon_indices: [0, 1]
  zero_offset_length: [0.057, 0.040]

rigid_tendons: {}

antagonistic_spring:
  spring_constant_range: ${eval:'[0.075, 0.075] if mode == "train" else [0.025, 0.075]'}

observation:
  num_hist: 20
  hist_stride: 5
  modules:
  - robot_state
  - goal_finger_tip

goal_pose_discrete:
  goal_position:
    x: [-0.09, -0.02]
    y: [-0.12, -0.12]
    z: [0.16, 0.20]
  goal_orientation: [0, 0, 0, 1]
  resample_prob: 0.005

goal_pose_sinusoidal:
  goal_position:
    x: [-0.09, -0.02]
    y: [-0.12, -0.12]
    z: [0.16, 0.20]
  goal_orientation: [0, 0, 0, 1]
  # Per-axis, per-env sinusoid in Hz: amp = fraction x half-range, phase in [0, 2pi);
  # dt = timestep x frame_skip (10ms at the current 100Hz control rate).
  sinusoidal:
    min_frequency: 0.2
    max_frequency: 0.8
    min_amplitude_fraction: 0.0
    max_amplitude_fraction: 1.0

goal_pose_square:
  goal_position:
    x: [-0.09, -0.02]
    y: [-0.12, -0.12]
    z: [0.16, 0.20]
  goal_orientation: [0, 0, 0, 1]
  plane: [0, 2]
  speed:
    min: 0.05
    max: 0.2

reward:
  goal_finger_tip_reward:
    scale: 5.0
    normalize: 0.025
    link_name: "DP"
  action_penalty_reward:
    scale: 0.01
  action_smoothness_reward:
    scale: 0.01

termination:
  progress:
    max_episode_length: 600

render:
  capped_step: true
  paused: false
  raise_exception: true
  camera:
    eye: [-0.310728, 0.179221, 0.331265]
    target: [0.654746, -0.647702, -0.389602]