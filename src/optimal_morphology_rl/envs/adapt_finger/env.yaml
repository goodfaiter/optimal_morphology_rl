modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - randomize_joint_friction
    - create_kinematic_sensor
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - prismatic_force_m5
    - antagonistic_spring
    - apply_motor_forces
    - apply_root_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - update_kinematic_sensor
    - observation
    - reward
    - termination
    - goal_pose_square
    - goal_visualization

create_rigid_vsim_envs:
  num_envs: 1024
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 1
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_one_finger.vsim
  fixed_hand: true
  fixed_hand_root_pos: [-0.15, -0.15, 0.1]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendon is fixed (FixedTendonMaterial, driven by rigid_tendons) and gets no policy action.
  fixed_tendon_substrings: ["dip"]

process_variable_actions:
  min_dof_scale: -2.0
  max_dof_scale: 2.0

apply_motor_forces: {}
apply_root_forces: {}

# Servo spool model (M5 friction) driving the tendon actuator sliders: the prismatic
# joint is the spool rim (theta = q / r), the slider armature is the servo inertia, and
# the slider motor force is (tau_motor + tau_friction) / r. Builds the tendon action
# space itself (replaces 'robot_control_tendons' + 'apply_tendon_forces'); the DIP
# tendon is fixed and has no slider. Alternative to 'tendon_force_m5'/'tendon_est'.
prismatic_force_m5:
  pully_radius: 0.0105 # 0.0105m but we double because the tendon is doubled over the pulleys
  model_tendon_indices: [0, 1]
  motor_gain: 0.105 # Nm/rad
  J: 0.0011136 # Nm*s^2/rad
  K_v: 0.00383633
  K_c: 0.00667819
  K_m: 0.162697
  K_e: 0.0272222
  v_s: 0.0709052
  alpha: 1.86053
  K_cs: 0.0112702
  K_ms: 0.137333
  K_es: 0.0247055

antagonistic_spring:
  spring_constant_range: ${eval:'[0.05, 0.05] if mode == "train" else [0.025, 0.075]'}

randomize_joint_friction:
  joint_friction_range: ${eval:'[0.02, 0.02] if mode == "train" else [0.01, 0.075]'}

observation:
  num_hist: 40
  hist_stride: 10
  modules:
  - robot_state
  - goal_finger_tip

goal_pose_discrete:
  goal_position:
    x: [-0.09, -0.02]
    y: [-0.12, -0.12]
    z: [0.16, 0.20]
  goal_orientation: [0, 0, 0, 1]
  resample_prob: 0.005

goal_pose_sinusoidal:
  goal_position:
    x: [-0.09, -0.02]
    y: [-0.12, -0.12]
    z: [0.16, 0.20]
  goal_orientation: [0, 0, 0, 1]
  # Per-axis, per-env sinusoid in Hz: amp = fraction x half-range, phase in [0, 2pi);
  # dt = timestep x frame_skip (10ms at the current 100Hz control rate).
  sinusoidal:
    min_frequency: 0.2
    max_frequency: 0.8
    min_amplitude_fraction: 0.0
    max_amplitude_fraction: 1.0

goal_pose_square:
  goal_position:
    x: [-0.09, -0.02]
    y: [-0.12, -0.12]
    z: [0.16, 0.20]
  goal_orientation: [0, 0, 0, 1]
  plane: [0, 2]
  speed:
    min: 0.05
    max: 0.2

reward:
  goal_finger_tip_reward:
    scale: 1.0
    normalize: 0.02
    link_name: "DP"
  action_penalty_reward:
    scale: 0.01
  action_smoothness_reward:
    scale: 0.01

termination:
  progress:
    max_episode_length: 600

render:
  capped_step: true
  paused: false
  raise_exception: true
  camera:
    eye: [-0.310728, 0.179221, 0.331265]
    target: [0.654746, -0.647702, -0.389602]