modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - randomize_joint_friction
    - randomize_friction
    - termination
    - render
  pre_physics_step_modules:
    - render
    - interactive_slider_control
    - process_variable_actions
    - prismatic_force_m5
    - antagonistic_spring
    - apply_motor_forces
    - apply_root_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - observation
    - reward
    - termination

create_rigid_vsim_envs:
  num_envs: 1
  device: cuda:0
  rendering: true
  with_window: true
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 1
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_one_finger.vsim
  fixed_hand: true
  fixed_hand_root_pos: [0.0, 0.0, 0.2]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendon is fixed (FixedTendonMaterial, driven by rigid_tendons) and
  # gets no policy action.
  fixed_tendon_substrings: ["dip"]
  # Make every motor controllable from the UI (no passive motors).
  passive_motor_substrings: []

apply_motor_forces: {}
apply_root_forces: {}

randomize_friction:
  friction_coefficient: 0.8

interactive_slider_control:
  slider_min: 0.0
  slider_max: 6.6

process_variable_actions:
  min_dof_scale: -1.0
  max_dof_scale: 1.0

# Servo spool model (M5 friction) driving the tendon actuator sliders: the prismatic
# joint is the spool rim (theta = q / r), the slider armature is the servo inertia, and
# the slider motor force is (tau_motor + tau_friction) / r. Builds the tendon action
# space itself (replaces 'robot_control_tendons' + 'apply_tendon_forces'); the DIP
# tendon is fixed and has no slider. Alternative to 'tendon_force_m5'/'tendon_est'.
  # K_v = 0.00383633
  # K_c = 0.00667819
  # K_m = 0.512697
  # K_e = 0.0272222
  # v_s = 0.0709052
  # alpha = 1.86053
  # K_cs = 0.0112702
  # K_ms = 0.337333
  # K_es = 0.0247055



prismatic_force_m5:
  pully_radius: 0.0105 # 0.0105m but we double because the tendon is doubled over the pulleys
  model_tendon_indices: [0, 1]
  motor_gain: 0.105 # Nm/rad
  J: 0.0011136 # Nm*s^2/rad
  K_v: 0.00383633
  K_c: 0.00667819
  K_m: 0.162697
  K_e: 0.0272222
  v_s: 0.0709052
  alpha: 1.86053
  K_cs: 0.0112702
  K_ms: 0.137333
  K_es: 0.0247055

# Filtered finite-difference tendon velocity/acceleration computed by 'update_robot'
# (winding convention dL = -radius * dtheta; the simulator's tendon velocity buffer
# is unreliable), consumed by 'tendon_force_m5'. The soft deadband attenuates the
# residual length-jitter noise floor: prevents the acceleration FD from amplifying
# it into bang-bang force chatter at the stop.
update_robot:
  max_tendon_speed: 0.22
  vel_filter_alpha: 0.95
  acc_filter_alpha: 0.95
  vel_deadband: 0.0
  acc_deadband: 0.0

antagonistic_spring:
  spring_constant_range: [0.1, 0.1]

randomize_joint_friction:
  joint_friction_range: [0.02, 0.02]

observation:
  num_hist: 1
  hist_stride: 1
  modules:
    - robot_state

reward: {}

termination:
  progress:
    max_episode_length: 1000000

render:
  capped_step: false
  paused: false
  raise_exception: true
  camera:
    eye: [0.049792, 0.161890, 0.291726]
    target: [0.586387, -0.742233, -0.324408]
