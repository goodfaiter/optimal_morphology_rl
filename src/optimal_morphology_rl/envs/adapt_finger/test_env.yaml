modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - create_spool
    - randomize_joint_friction
    - randomize_friction
    - termination
    - render
  pre_physics_step_modules:
    - render
    - interactive_slider_control
    - process_variable_actions
    - create_spool
    - spool_plot
    - apply_m5_forces
    - antagonistic_spring
    - apply_motor_forces
    - apply_root_forces
  pre_gym_step_modules: []
  post_gym_step_modules: []
  post_physics_step_modules:
    - update_robot
    - observation
    - reward
    - termination

create_rigid_vsim_envs:
  num_envs: 1
  device: cuda:0
  rendering: true
  with_window: true
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 1
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_one_finger.vsim
  fixed_hand: true
  fixed_hand_root_pos: [0.0, 0.0, 0.2]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendon is fixed (FixedTendonMaterial, driven by rigid_tendons) and
  # gets no policy action.
  fixed_tendon_substrings: ["dip"]
  # Make every motor controllable from the UI (no passive motors).
  passive_motor_substrings: []

# Finite-difference velocities for the apply_m5_forces stop torque and the robot_state observation.
update_robot:
  velocity_source: fd

apply_motor_forces: {}
apply_root_forces: {}

randomize_friction:
  friction_coefficient: 0.8

interactive_slider_control:
  slider_min: 0.0
  slider_max: 6.6

process_variable_actions:
  min_dof_scale: -1.0
  max_dof_scale: 1.0

# Servo spools on the tendon actuator sliders: the prismatic joint is the spool rim
# (theta = q / r) and the slider armature is the servo inertia. Builds the tendon action
# space (replaces 'robot_control_tendons' + 'apply_tendon_forces'); the DIP tendon is
# fixed and has no slider.
create_spool:
  pully_radius: 0.005 # [m]
  model_tendon_indices: [0, 1]

# M5-friction servo law on the spools: slider motor force (tau_motor + tau_friction) / r,
# applied by 'apply_motor_forces'. Alternative to 'tendon_force_m5'/'tendon_est'.
# Live plot of every spool's command, angle and velocity (env 0) in its own window; it can be
# minimized or closed without affecting the simulation.
spool_plot:
  every: 2
  window_s: 5.0

apply_m5_forces:
  # friction_model_path: 2026_10_14_m5_mlp_common_friction.pt
  motor_gain: 0.0389 # Nm/rad
  K_v: 0.002
  K_c: 0.014
  K_m: 0.11
  K_e: 0.12
  v_s: 0.09
  alpha: 1.6
  K_cs: 0.005
  K_ms: 0.09
  K_es: 0.03

antagonistic_spring:
  spring_constant_range: [0.005, 0.005]

randomize_joint_friction:
  joint_friction_range: [0.0, 0.0]

observation:
  num_hist: 1
  hist_stride: 1
  modules:
    - robot_state

reward: {}

termination:
  progress:
    max_episode_length: 1000000

render:
  capped_step: false
  paused: false
  raise_exception: true
  camera:
    eye: [0.049792, 0.161890, 0.291726]
    target: [0.586387, -0.742233, -0.324408]
