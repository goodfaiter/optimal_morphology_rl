modules:
  init_modules:
    - create_rigid_vsim_envs
    - create_robot
    - randomize_antagonistic_springs
    - create_spool
    - randomize_joint_friction
    - randomize_spool
    - randomize_link_inertia
    # - randomize_m5
    - randomize_spool_velocity
    - create_objects
    - create_kinematic_sensor
    - create_force_sensor
  # Once per control step (the policy's action): frame_skip physics substeps follow, each running the pre_gym /
  # post_gym modules (the servo law at the physics rate), then the post_physics modules once.
  pre_physics_step_modules:
    - render
    - process_variable_actions
    - update_spool_target # hold target: the desired spool angle fixed once per control step (without it: offset)
    - spool_plot
  pre_gym_step_modules:
    - update_spool
    - apply_m5_forces
    - antagonistic_spring
    - apply_motor_forces
  post_gym_step_modules:
    - update_kinematics # forward kinematics after every physics substep
    - update_robot # every substep reads the state the last one reached
  post_physics_step_modules:
    - update_kinematic_sensor
    - update_force_sensors
    - force_goal
    - force_plot
    - reward
    - termination
    - reset_envs
    - observation

create_rigid_vsim_envs:
  num_envs: 1024
  num_envs_per_set: 1 # one robot per env set, so joint friction is randomized per env
  # The seed comes from ppo.yaml params.seed (or --seed); see sync_seed in modular_runner.py.
  enhanced_determinism: true # vlearn determinism mode (~1 % slower)
  device: cuda:0
  enable_scene_query: true
  timestep: ${1/200}
  frame_skip: 1
  spacing: 0.75
  gravity: [0.0, 0.0, -9.81]
  up_axis: [0.0, 0.0, 1.0]
  max_contact_pairs_per_env: 64
  max_contact_points_per_patch: 4

create_robot:
  vsim_path: /workspace/optimal_morphology_rl_assets/optimal_morphology_rl_assets/assets/hands/Adapt_Hand_v4/adapt_hand_v4_one_middle.vsim
  fixed_hand: true
  fixed_hand_root_pos: [-0.15, -0.15, 0.1]
  fixed_hand_root_quat: [-0.5, 0.5, -0.5, 0.5]
  use_tendon: true
  randomize_pose: false
  # The DIP tendon is fixed (FixedTendonMaterial, driven by rigid_tendons) and gets no policy action.
  fixed_tendon_substrings: ["dip"]
  # Every episode starts with the finger curled above the cylinder, the fingertip ~28 mm (from) to ~11 mm (to) above
  # its top face, a uniform blend between the two. Poses the sim reached curling under a constant command (tendon
  # sliders in m).
  reset_pose:
    from: {Middle_MCP: 1.1845, Middle_PIP: 1.0286, Middle_DIP: 1.1064, Middle_mcp_tendon_slider_joint: 0.0115, Middle_pip_tendon_slider_joint: 0.0116}
    to: {Middle_MCP: 1.4261, Middle_PIP: 1.2093, Middle_DIP: 1.2637, Middle_mcp_tendon_slider_joint: 0.0138, Middle_pip_tendon_slider_joint: 0.0139}

# The fixed cylinder (radius 12.5 mm, height 15 mm, axis up) the middle fingertip presses on: under the fully curled
# fingertip (MCP / PIP / DIP at ~pi/2: tip at (-99, -172, 144) mm, moving down), its top face 2 mm above the tip, so
# the tip lands on it just before the joint limits (the cylinder, not the limits, takes the load).
create_objects:
  objects:
    cylinder:
      position: [-0.099, -0.172, 0.1475] # m, env frame (center)
      # Per env on reset, in training: the height +-5 mm and a tilt of up to +-10 deg about x and about y (the
      # guide reward's target follows the tilted top face); nominal in play.
      height_range: ${eval:'[-0.005, 0.005] if mode == "train" else [0.0, 0.0]'} # m
      tilt_deg: ${eval:'10.0 if mode == "train" else 0.0'}
  reward_object: cylinder

# The force sensor on the middle fingertip (Middle_DP, 'contact' flags: the contact forces on the link).
create_force_sensor:
  link_names: ["Middle_DP"]

# Target fingertip force in force_range, the envs split evenly over the goal types: discrete (constant, redrawn with
# a mean hold of mean_hold_sec, 0 N in zero_prob of the draws) and sinusoidal (the range's center + a sinusoid). The finger
# reaches ~12 N on the cylinder (servo friction on: 0.1 N at a 4 rad spool command, 1.9 N at 5, 4.4 N at 6).
# Live plot of env 0's target and measured fingertip force in its own window, in play mode only
# (it can be minimized or closed without affecting the simulation).
force_plot:
  enabled: ${eval:'mode == "play"'}
  every: 2
  window_s: 5.0

force_goal:
  sensor_link: Middle_DP
  force_range: [0.0, 3.0] # N
  types:
    sinusoidal:
      sinusoidal:
        min_frequency: 0.1 # Hz
        max_frequency: 0.5
        min_amplitude_fraction: 0.2 # of the half-range
        max_amplitude_fraction: 1.0
    discrete:
      mean_hold_sec: 1.67 # s, mean time between target redraws (any frame_skip)
      zero_prob: 0.1

process_variable_actions:
  # Change of the spool angle [rad] (MCP, PIP): desired = position + action (>= -1 rad); the servo current is
  # 0.1 A/rad * (desired - position). The ranges only scale the unclipped policy output.
  min_dof_scale: [-0.5, -0.5]
  max_dof_scale: [0.5, 0.5]

apply_motor_forces: {}

# Servo spools on the tendon actuator sliders: the prismatic joint is the spool rim
# (theta = q / r) and the slider armature is the servo inertia. Builds the tendon action
# space (replaces 'robot_control_tendons' + 'apply_tendon_forces'); the DIP tendon is
# fixed and has no slider.
create_spool:
  pully_radius: 0.005 # [m]
  model_tendon_indices: [0, 1]

# Live plot of env 0's spool command, angle and velocity in its own window, in play mode only
# (it can be minimized or closed without affecting the simulation).
spool_plot:
  enabled: ${eval:'mode == "play"'}
  every: 1
  window_s: 5.0

# M5-friction servo law on the spools: slider motor force (tau_motor + tau_friction) / r,
# applied by 'apply_motor_forces'.
apply_m5_forces:
  # friction: False
  friction_model_path: mlp_dynamic_envelope.pt # learned tau_f_max(omega, target - theta) instead of the M5 constants
  motor_position_gain: 0.1 # A/rad, current = gain * (target - position), as on the robot
  torque_constant: 0.500 # Nm/A, torque = K_t * sign(i) * max(|i| - i_0, 0)
  current_deadband: 0.0496 # A, i_0
  max_spool_velocity: 7.6 # rad/s, servo speed limit (measured: PWM saturates)
  K_v: 0.0045
  K_c: 0.0024
  K_m: 0.007
  K_e_wind: 0.243
  K_e_unwind: 0.385
  v_s: 0.2
  alpha: 1.6
  K_cs: 0.0028
  K_ms: 0.153
  K_es: 0.260

# Per revolute motor (Abd, MCP, PIP, DIP; the free Abd joint has no tendon, only this spring), Nm/rad, the same in
# train and play.
antagonistic_spring:
  spring_constants: {default: 0.005}
  # spring_constants: [0.055, 0.08, 0.08]

# Spring constants within +-10 % of the nominal, per env and motor on reset; nominal in play.
randomize_antagonistic_springs:
  scale: ${eval:'0.1 if mode == "train" else 0.0'}

randomize_joint_friction:
  joint_friction_range: ${eval:'[0.0, 0.1] if mode == "train" else [0.0, 0.0]'}

# Servo spool, per env and tendon on reset: pulley radius +-10 % around 5 mm and slider armature
# (reflected rotor inertia J / r^2) +-20 % around the vsim's 48 kg (J = 0.0012 kg m^2); nominal in play. The
# servo's stop-torque inertia J_eff = (armature + slider mass) * r^2 is recomputed after each resample.
randomize_spool:
  pully_radius_range: ${eval:'[0.0045, 0.0055] if mode == "train" else [0.005, 0.005]'}
  armature_range: ${eval:'[38.4, 57.6] if mode == "train" else [48.0, 48.0]'}

# Finger link masses +-20 % (inertia follows the mass) and an extra +-20 % on the inertia,
# per link and env on reset; nominal in play. Default links: all but the spool sliders.
randomize_link_inertia:
  mass_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}
  inertia_scale_range: ${eval:'[0.8, 1.2] if mode == "train" else [1.0, 1.0]'}

# Servo speed limit of 'apply_m5_forces' per env and tendon on reset (the real servo saturates its PWM
# at ~7.6 rad/s, lower under load); nominal in play.
randomize_spool_velocity:
  max_spool_velocity_range: ${eval:'[6.4, 8.0] if mode == "train" else [7.6, 7.6]'} # rad/s

# Friction of 'apply_m5_forces' (tau_f_max) x U[1 - scale, 1 + scale], one factor per env, redrawn on its reset;
# nominal in play.
randomize_m5:
  scale: ${eval:'0.25 if mode == "train" else 0.0'}

observation:
  num_hist: 25
  hist_stride: 2
  modules:
    spool_state:
      # Observation noise per env and tendon, drawn on reset (the spool command and dynamics are
      # unchanged); none in play. Encoder zero offset of the angle (rad), first-order low-pass lag of
      # the velocity (time constant, s; the control step is 5 ms) and a velocity bias (rad/s).
      noise:
        angle_offset_range: ${eval:'[-0.1, 0.1] if mode == "train" else [0.0, 0.0]'}
        velocity_lag_range: ${eval:'[0.0, 0.02] if mode == "train" else [0.0, 0.0]'}
        velocity_offset_range: ${eval:'[-0.2, 0.2] if mode == "train" else [0.0, 0.0]'}
        # White noise, drawn every step (training only; not shrunk by the curriculum): rad, rad/s.
        angle_std: ${eval:'0.25 if mode == "train" else 0.0'}
        velocity_std: ${eval:'0.5 if mode == "train" else 0.0'}
    spool_action: {} # the policy's current command per spool (rad; with the history: its recent commands)
    force_goal: {} # the target fingertip force (N)
  # Critic only (rl_games central_value_config in ppo.yaml): the critic sees the observations above plus these
  # sim-only signals of the current step; the deployed policy does not.
  privileged_modules:
    spool_torques:
      signals: [tau_f_max] # friction budget of apply_m5_forces per spool (Nm)
    fingertip_force: {} # the measured fingertip force (N)

reward:
  # exp(-((fingertip force - target) / normalize)^2)
  force_tracking_reward:
    scale: 1.0
    normalize: 0.3 # N
    # max_error: 3.0 # N, the error is clipped to +-3 N
  # exp(-(distance / normalize)^2) from the fingertip (DP tip) to the cylinder's top face center; always on
  # (only_with_goal: false), so the fingertip also rests on the cylinder at 0 N instead of moving away.
  fingertip_guide_reward:
    scale: 0.1
    normalize: 0.08 # m
    tip_sensor: Middle_DP
    target_offset: [0.0, 0.0, 0.0075] # m, the top face (cylinder height 15 mm)
    only_with_goal: false
  # action_penalty_reward:
  #   scale: 0.001
  # action_smoothness_reward:
  #   scale: 0.001
  # action_oscillation_reward:
  #   scale: 0.01
  #   low_hz: 1.0
  #   high_hz: 10.0

termination:
  progress:
    max_episode_sec: 12.0 # s (any frame_skip)

render:
  capped_step: true
  paused: false
  raise_exception: true
  camera:
    eye: [-0.310728, 0.179221, 0.331265]
    target: [0.654746, -0.647702, -0.389602]