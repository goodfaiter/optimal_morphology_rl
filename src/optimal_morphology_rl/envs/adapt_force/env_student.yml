observation:
  modules:
    spool_state:
      # Angle and velocity observation noise: encoder zero offset and white angle noise (rad), first-order
      # low-pass lag on omega (s), velocity bias and white velocity noise (rad/s). Train only (nominal in
      # play); the curriculum shrinks the ranges toward 0 (full at the distill's curriculum 1.0).
      noise:
        angle_offset_range: ${eval:'[-0.1, 0.1] if mode == "train" else [0.0, 0.0]'}
        angle_std: ${eval:'0.25 if mode == "train" else 0.0'}
        velocity_lag_range: ${eval:'[0.0, 0.02] if mode == "train" else [0.0, 0.0]'}
        velocity_offset_range: ${eval:'[-0.2, 0.2] if mode == "train" else [0.0, 0.0]'}
        velocity_std: ${eval:'0.5 if mode == "train" else 0.0'}
    spool_torques:
      signals: ["tau_inertia", "tau_m", "tau_f_max"]
